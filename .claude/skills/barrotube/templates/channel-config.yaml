# channel-config.yaml — BarroTube federated channel manifest v1
# 정본 위치: ${BARROTUBE_DATA}/workspace/channels/<channel-id>/channel.yaml
#
# 새 채널 추가:
#   1. 이 파일을 정본 위치에 복사해 값과 기존 자산 경로를 연결한다.
#   2. status는 needs_review로 유지하고 중앙 보드에서 충돌·경로를 검토한다.
#   3. unresolved conflict가 0일 때만 active로 전환한다.
#
# 원본 영상·이미지·문서를 이 디렉토리로 옮기지 않는다. paths가 기존 위치를 참조하는
# federated registry이며, credential 값 자체가 아닌 환경변수 이름만 기록한다.

schema_version: 1
id: <channel-id>                    # 소문자 영숫자, 점(.), 하이픈(-)
revision: 1                         # 보드 저장 때 증가; 직접 되감지 않는다
status: needs_review                # needs_review | active | paused | archived

identity:
  display_name: <한국어 채널명>
  description: <한 줄 설명>
  owner: beye
  language: ko
  target_country: KR
  timezone: Asia/Seoul

platforms:
  youtube:
    enabled: true
    channel_id: null                # 실제 발행 계정을 검증한 뒤 입력
    default_privacy: unlisted       # public | unlisted | private
    category_id: 22                 # 22 = People & Blogs
    upload_quota_daily: 6
  # instagram:
  #   enabled: false
  #   handle: "@channel"
  #   account_id: null

pipeline:
  profile: barrotube-s12            # barrotube-s12 | media-render-r11 | carousel-c4
  additional_profiles: []           # 예: [carousel-c4]

formats:
  enabled: [shorts, long-3min]
  default: shorts

personas:
  shorts: barro-alert
  long-3min: barro-teacher

cadence:
  timezone: Asia/Seoul
  shorts:
    target_per_week: 7
    days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
    time: "18:00"
  long-3min:
    target_per_week: 3
    days: [Mon, Wed, Fri]
    time: "12:00"

paths:
  project_root: ${BARROTUBE_DATA}/workspace/channels/<channel-id>
  episodes_root: ${BARROTUBE_DATA}/workspace/episodes
  series_index: ${BARROTUBE_DATA}/workspace/channels/<channel-id>/series/index.json
  brand: ${BARROTUBE_DATA}/workspace/channels/<channel-id>/brand.md
  character_dna: ${BARROTUBE_DATA}/workspace/channels/<channel-id>/character-dna.md
  character_sheets: []
  style_guides:
    shorts: ${BARROTUBE_DATA}/workspace/channels/<channel-id>/style-guide-shorts.md
    long-3min: ${BARROTUBE_DATA}/workspace/channels/<channel-id>/style-guide-long.md
  policies: []
  reference_docs: []

document:
  title: <채널명> 영상 제작·관리 설계문서
  output_path: ${BARROTUBE_DATA}/workspace/channels/<channel-id>/<channel-id>-영상제작-설계문서.html

credentials:
  youtube:
    client_id_env: YOUTUBE_CHANNEL_OAUTH_CLIENT_ID
    client_secret_env: YOUTUBE_CHANNEL_OAUTH_CLIENT_SECRET
    refresh_token_env: YOUTUBE_CHANNEL_OAUTH_REFRESH_TOKEN

# 아래 운영 설정은 기존 파이프라인에서 계속 사용한다.
branding:
  intro_card:
    template_path: ${BARROTUBE_DATA}/workspace/channels/<channel-id>/intro-template.png
    duration_seconds: 2
    audio: silent
  thumbnail:
    style_guide_path: ${BARROTUBE_DATA}/workspace/channels/<channel-id>/style-guide-thumbnail.md
    max_korean_chars: 6
    color_palette:
      barro-teacher: "#F4A261"
      barro-alert: "#E63946"

playlists:
  auto_register_for_series: true
  default_privacy: unlisted

budget_override: {}                   # 미설정 시 config/budget-policy.json 사용

competitor_channels: []              # config/competitor-channels.json 외 추가 대상

seo:
  blue_ocean_keywords: []
  default_hashtags: ["#BarroTube"]

migration:
  imported_at: null
  reviewed_at: null
  sources: []                      # 기존 설정·문서·자산 경로와 provenance
  conflicts: []                    # 발견 시 field/reason/candidates/resolution 기록
