}

function bindEvents() {
  document.getElementById('channelSelect').addEventListener('change', function (event) {
    selectChannel(event.target.value);
  });
  document.getElementById('refreshButton').addEventListener('click', loadAll);
  document.getElementById('newChannelButton').addEventListener('click', openNewChannel);
  document.getElementById('settingsButton').addEventListener('click', openSettings);
  document.getElementById('openDocumentButton').addEventListener('click', openDocument);
  document.getElementById('renderDocumentButton').addEventListener('click', renderDocument);
  document.getElementById('episodeSearch').addEventListener('input', renderEpisodes);
  document.getElementById('stageFilter').addEventListener('change', renderEpisodes);
  document.getElementById('episodeSort').addEventListener('change', renderEpisodes);
  document.getElementById('episodeSortDir').addEventListener('change', renderEpisodes);
  document.getElementById('settingsForm').addEventListener('submit', saveChannel);
  document.getElementById('activateButton').addEventListener('click', activateChannel);
  document.getElementById('newForm').addEventListener('submit', createChannel);

  document.getElementById('workspaceBody').addEventListener('change', function (event) {
    var role = event.target.dataset.role;
    if (role !== 'profile' && role !== 'platform') return;
    var index = Number(event.target.dataset.groupIndex);
    var group = EPISODE_GROUPS[index];
    if (!group) return;
    var item = event.target.closest('[data-episode-item]');
    var surfaceId = item && item.closest('#episodeCards') ? 'episodeCards' : 'episodeTable';
    if (role === 'profile') {
      VARIANT_BY_EPISODE[group.key] = event.target.value;
    } else {
      var episode = selectedVariant(group);
      var key = group.key + '::' + String(episode.source_profile || 'unknown');
      PLATFORM_BY_VARIANT[key] = event.target.value;
    }
    renderStageFilter();
    renderEpisodes();
    restoreEpisodeControlFocus(surfaceId, index, role);
  });
  document.getElementById('workspaceBody').addEventListener('click', function (event) {
    var button = event.target.closest('button[data-command]');
    if (!button) return;
    var index = Number(button.dataset.groupIndex);
    var item = button.closest('[data-episode-item]');
    if (!item) return;
    if (button.dataset.command === 'assets') inspectAssets(index, item);
    else runEpisodeAction(index, button.dataset.command === 'dry-run', item);
  });
  document.getElementById('assetTabs').addEventListener('click', function (event) {
    var button = event.target.closest('[data-asset-tab]');
    if (!button || button.disabled || !ASSET_STATE) return;
    var tabId = button.dataset.assetTab;
    ASSET_STATE.tab = tabId;
    renderAssetTabs();
    requestAnimationFrame(function () {
      var replacement = document.getElementById('asset-tab-' + tabId);
      if (replacement) replacement.focus();
    });
  });
  document.getElementById('assetTabs').addEventListener('keydown', function (event) {
    if (!['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(event.key)) return;
    var tabs = Array.from(document.querySelectorAll('#assetTabs [role="tab"]:not(:disabled)'));
    if (!tabs.length) return;
    var index = Math.max(0, tabs.indexOf(document.activeElement));
    if (event.key === 'ArrowRight') index = (index + 1) % tabs.length;
    if (event.key === 'ArrowLeft') index = (index - 1 + tabs.length) % tabs.length;
    if (event.key === 'Home') index = 0;
    if (event.key === 'End') index = tabs.length - 1;
    event.preventDefault();
    tabs[index].focus();
    tabs[index].click();
  });
  document.getElementById('assetPanel').addEventListener('click', function (event) {
    if (event.target.closest('[data-asset-retry]')) {
      if (ASSET_STATE) loadAssetDialogData(ASSET_STATE);
      return;
    }
    var button = event.target.closest('[data-asset-path]');
    if (!button || !ASSET_STATE) return;
    var selectedPath = button.dataset.assetPath;
    ASSET_STATE.selected[ASSET_STATE.tab] = selectedPath;
    renderAssetPanel();
    requestAnimationFrame(function () {
      var replacement = Array.from(document.querySelectorAll('#assetPanel [data-asset-path]'))
        .find(function (item) { return item.dataset.assetPath === selectedPath; });
      if (replacement) replacement.focus();
    });
  });
  document.querySelectorAll('[data-close]').forEach(function (button) {
    button.addEventListener('click', function () {
      document.getElementById(button.dataset.close).close();
    });
  });
  document.querySelectorAll('dialog').forEach(function (dialog) {
    dialog.addEventListener('click', function (event) {
      if (event.target === dialog) dialog.close();
    });
  });
  document.getElementById('assetDialog').addEventListener('close', closeAssetDialogState);
}

bindEvents();
loadAll();
</script>
</body>
</html>
