<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BarroTube Channel Board</title>
  <style>
    /* 팔레트 출처: 오늘묘 S1 제작·관리 설계문서 (:root 토큰 그대로).
       따뜻한 종이 위에 테라코타(행동) · 로즈(발행=비가역) · 초록(통과) · 파랑(진행)만 쓴다.
       --navy/--blue 는 옛 이름을 유지해 기존 규칙 200여 개를 건드리지 않고 값만 바꾼다. */
    :root {
      --ink: #33302c;
      --muted: #8a8178;
      --line: #ece3d8;
      --line-soft: #f5efe5;
      --bg: #fbf7f2;
      --paper: #fff;
      --warm: #fdf3e7;
      --navy: #33302c;
      --blue: #e08a3c;          /* 주 강조 = 테라코타 */
      --blue-soft: #fdf3e7;
      --rose: #d0607a;          /* 발행·비가역 */
      --rose-soft: #fbeef3;
      --prog: #3e7fc1;
      --prog-soft: #eaf2fb;
      --ok: #3f9d6b;
      --ok-bg: #e9f6ee;
      --warn: #9a5518;
      --warn-bg: #fdf1e7;
      --bad: #b0436a;
      --bad-bg: #fbeef3;
      --na: #c9c1b6;
      --shadow: 0 3px 15px rgba(180, 150, 110, .10);
      --shadow-sm: 0 1px 6px rgba(180, 150, 110, .08);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Noto Sans KR", sans-serif;
    }
    button, input, select, textarea { font: inherit; }
    button, select { cursor: pointer; }
    /* 레퍼런스에도 포커스 스타일이 없다. 한 행에 조작 요소가 11개인 표라
       키보드 위치를 잃으면 잘못된 행에서 실행을 누른다 — 팔레트 어휘로 링을 세운다. */
    :focus-visible {
      outline: 2px solid var(--blue);
      outline-offset: 1px;
      border-radius: 6px;
    }

    /* 레퍼런스는 상단바를 어둡게 덮지 않는다 — 흰 바 + 웜 헤어라인 한 줄.
       그래야 종이 바탕이 페이지 전체를 지배하고 표가 주인공이 된다. */
    .top {
      height: 56px;
      background: var(--paper);
      color: var(--ink);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 22px;
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 1px solid var(--line);
    }
    .top h1 { margin: 0; font-size: 17px; font-weight: 800; }
    .spacer { flex: 1; }
    .live { color: var(--muted); font-size: 12px; }

    main {
      width: min(1540px, 100%);
      margin: 0 auto;
      padding: 18px 22px 28px;
    }

    .channel-toolbar {
      min-height: 72px;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 11px 14px;
      margin-bottom: 14px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: var(--shadow);
    }
    .channel-picker { width: min(390px, 36vw); min-width: 260px; }
    .channel-picker label {
      display: block;
      margin: 0 0 4px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 750;
    }
    .channel-picker select {
      width: 100%;
      height: 38px;
      border: 1px solid #e0d3c2;
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      padding: 0 34px 0 10px;
      font-weight: 700;
    }
    .channel-meta {
      min-width: 160px;
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
    }
    .channel-profile, .revision {
      color: var(--muted);
      font-size: 11px;
    }
    .summary-strip {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .stat {
      min-width: 78px;
      padding: 6px 9px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #faf5ee;
      color: var(--muted);
      font-size: 11px;
      white-space: nowrap;
    }
    .stat b { color: var(--ink); font-size: 14px; margin-right: 3px; }

    .btn {
      min-height: 36px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      padding: 7px 11px;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn:hover { border-color: var(--blue); background: var(--warm); }
    .btn.primary { border-color: var(--blue); background: var(--blue); color: #fff; }
    .btn.good { border-color: var(--ok); background: var(--ok); color: #fff; }
    /* 레퍼런스는 발행(비가역)을 빨강 경고가 아니라 로즈 채움으로 구분한다 —
       위험이 아니라 "되돌릴 수 없음"을 말하는 색. */
    .btn.danger {
      border-color: #e6bccb;
      background: var(--rose-soft);
      color: var(--bad);
      font-weight: 700;
    }
    .btn.danger:hover { border-color: var(--rose); background: #f8e2ea; color: var(--bad); }
    .btn.small { min-height: 30px; padding: 4px 8px; font-size: 11px; }
    .btn.icon { width: 36px; padding: 0; font-size: 17px; }
    .btn:disabled { cursor: not-allowed; opacity: .45; }

    .panel {
      overflow: hidden;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: var(--shadow);
    }
    .workspace-head {
      min-height: 64px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 16px;
      border-bottom: 1px solid var(--line);
    }
    .workspace-title { min-width: 0; }
    .workspace-title h2 {
      overflow: hidden;
      margin: 0;
      font-size: 18px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .workspace-title p {
      overflow: hidden;
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 11px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .workspace-actions { display: flex; align-items: center; gap: 6px; }

    .episode-toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 56px;
      padding: 9px 14px;
      border-bottom: 1px solid var(--line);
      background: #fdfaf5;
    }
    .episode-toolbar strong { font-size: 14px; }
    .episode-count { color: var(--muted); font-size: 11px; white-space: nowrap; }
    .search {
      width: min(300px, 30vw);
      height: 34px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      padding: 0 10px;
    }
    .filter-select {
      width: 130px;
      height: 34px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      padding: 0 8px;
    }
    .production-summary {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      min-height: 44px;
      border-bottom: 1px solid var(--line);
      background: #fffdf9;
      padding: 7px 14px;
    }
    .production-stat {
      min-width: 108px;
      border: 1px solid #eadfce;
      border-radius: 8px;
      background: #fff9f1;
      padding: 5px 9px;
      color: var(--muted);
      font-size: 10px;
      white-space: nowrap;
    }
    .production-stat b { margin-right: 4px; color: var(--ink); font-size: 13px; }
    .production-track {
      flex: 1;
      min-width: 150px;
      height: 8px;
      display: flex;
      overflow: hidden;
      border-radius: 999px;
      background: var(--line-soft);
    }
    .production-track span { display: block; height: 100%; }
    /* 레퍼런스 .pbar 와 같은 3색: 발행=로즈 · QA=초록 · 생성=파랑.
       생성 구간에 강조색(테라코타)을 쓰면 "누를 것"과 "찬 만큼"이 같은 색이 된다. */
    .production-track .published { background: var(--rose); }
    .production-track .qa { background: var(--ok); }
    .production-track .generated { background: var(--prog); }

    .episode-table-wrap {
      min-height: 420px;
      max-height: calc(100vh - 270px);
      overflow: auto;
    }
    table {
      width: 100%;
      min-width: 1415px;
      border-collapse: separate;
      border-spacing: 0;
      table-layout: fixed;
    }
    caption {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
    }
    thead th {
      position: sticky;
      top: 0;
      z-index: 2;
      height: 38px;
      border-bottom: 1px solid var(--line);
      background: var(--warm);
      color: #8a5a20;
      font-size: 11px;
      font-weight: 750;
      text-align: left;
    }
    thead tr:first-child th { top: 0; height: 34px; }
    thead tr:nth-child(2) th { top: 34px; height: 30px; text-align: center; }
    thead th[rowspan="2"] { top: 0; z-index: 3; }
    /* 레퍼런스의 묶음 헤더(.wkhead) 어휘: 웜 채움 + 진한 앰버 글자 + 2px #f0c9a0 규칙선.
       "영상 생성" 4열이 한 덩어리라는 걸 색이 아니라 규칙선이 말하게 한다. */
    thead .generation-head {
      background: var(--warm);
      color: #8a5a20;
      text-align: center;
      border-top: 2px solid #f0c9a0;
      font-weight: 800;
    }
    thead tr:nth-child(2) th { border-bottom: 1px solid #f0c9a0; }
    th, td { padding: 8px 10px; vertical-align: middle; }
    /* 레퍼런스 표는 셀마다 --line(#ece3d8) 실선을 두른다. 여기선 세로선까지 두르면
       11열이 감옥처럼 보이므로 가로선만 같은 굵기로 올린다 — 84행을 눈으로 훑을 때
       --line-soft 는 너무 흐려 행이 미끄러진다. */
    tbody td { border-bottom: 1px solid var(--line); }
    tbody tr:nth-child(even) { background: #fdfbf8; }
    tbody tr:hover { background: #fbf5ec; }
    tbody tr.planned-row { background: #fffdf9; }
    .episode-id strong { display: block; font-size: 12px; }
    .episode-day {
      display: inline-block;
      margin-bottom: 2px;
      color: #9a5b13;
      font-size: 10px;
      font-weight: 800;
    }
    .episode-date {
      display: block;
      margin-bottom: 2px;
      color: var(--muted);
      font-size: 9px;
    }
    .episode-profile {
      display: block;
      overflow: hidden;
      margin-top: 2px;
      color: var(--muted);
      font-size: 10px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .episode-profile-select {
      width: 100%;
      height: 28px;
      margin-top: 3px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      font-size: 10px;
    }
    .episode-title {
      display: -webkit-box;
      overflow: hidden;
      font-size: 12px;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }
    .episode-folder {
      display: block;
      overflow: hidden;
      margin-top: 2px;
      color: var(--muted);
      font: 10px/1.35 ui-monospace, SFMono-Regular, Menlo, monospace;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .episode-beat {
      display: block;
      overflow: hidden;
      margin-top: 3px;
      color: #7a6d5f;
      font-size: 10px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .format-badge {
      display: inline-block;
      border-radius: 6px;
      padding: 2px 7px;
      background: var(--blue-soft);
      color: #9a5518;
      font-size: 10px;
      font-weight: 750;
      white-space: nowrap;
    }
    .format-badge.carousel { background: #f3ecfb; color: #6b4a9e; }
    .format-badge.shorts { background: #fbeef3; color: #a53d63; }
    .stage-cell { padding-right: 4px; padding-left: 4px; text-align: center; }
    .stage-chip {
      display: inline-block;
      min-width: 58px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #fff;
      color: var(--muted);
      padding: 3px 5px;
      font-size: 10px;
      font-weight: 700;
      text-align: center;
      white-space: nowrap;
    }
    .stage-chip.done { border-color: #bfe0cd; background: var(--ok-bg); color: #2c7a50; }
    .stage-chip.part { border-color: #f0d3a9; background: var(--warn-bg); color: var(--warn); }
    .stage-chip.na { border-color: transparent; background: transparent; color: var(--na); }
    .qa-badge {
      display: inline-block;
      min-width: 66px;
      border-radius: 7px;
      background: #f4f1ec;
      color: var(--muted);
      padding: 3px 6px;
      font-size: 10px;
      font-weight: 750;
      text-align: center;
      white-space: nowrap;
    }
    .qa-badge.pass { background: var(--ok-bg); color: var(--ok); }
    .qa-badge.fail { background: var(--bad-bg); color: var(--bad); }
    .qa-badge.part { background: var(--warn-bg); color: var(--warn); }
    .qa-stack { display: inline-grid; justify-items: center; gap: 3px; }
    .qa-auto {
      color: var(--muted);
      font-size: 9px;
      font-weight: 750;
      white-space: nowrap;
    }
    .qa-auto.pass { color: var(--ok); }
    .qa-auto.fail { color: var(--bad); }
    .publish-mark { color: var(--muted); font-size: 10px; font-weight: 750; white-space: nowrap; }
    .publish-mark.done { color: #a53d63; }
    .muted { color: var(--muted); font-size: 11px; }
    .pill {
      display: inline-flex;
      align-items: center;
      max-width: 100%;
      border-radius: 999px;
      padding: 2px 7px;
      font-size: 10px;
      font-weight: 750;
      white-space: nowrap;
    }
    /* 레퍼런스 상태 사다리(.status s0~s5):
       계획=회색 · 제작중=파랑 · 검토=앰버 · 통과=초록 · 발행=로즈.
       발행을 통과와 같은 초록으로 두면 "끝냈다"와 "내보냈다"가 구분되지 않는다. */
    .pill.active, .pill.qa-passed { color: var(--ok); background: var(--ok-bg); }
    .pill.published { color: var(--bad); background: var(--rose-soft); }
    .pill.review, .pill.approval, .pill.qa { color: var(--warn); background: var(--warn-bg); }
    .pill.archived, .pill.planned { color: var(--muted); background: #f4f1ec; }
    .pill.assets, .pill.production, .pill.render, .pill.script { color: #2f5a86; background: var(--prog-soft); }
    .pill.bad { color: var(--bad); background: var(--bad-bg); }
    .row-actions {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 5px;
      white-space: normal;
    }
    .row-actions select {
      width: 112px;
      height: 30px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #fff;
      padding: 0 6px;
      font-size: 11px;
    }
    .row-actions select.platform { width: 90px; }
    .duplicate-warning {
      display: block;
      margin-top: 3px;
      color: var(--bad);
      font-size: 10px;
      font-weight: 700;
    }
    .episode-cards { display: none; }
    .episode-card {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      padding: 12px;
      box-shadow: var(--shadow-sm);
    }
    .episode-card.planned-row { background: #fffdf9; }
    .episode-card-head { display: flex; align-items: flex-start; gap: 8px; }
    .episode-card-title { min-width: 0; flex: 1; }
    .episode-card-title strong { display: block; font-size: 14px; }
    .episode-card-meta { display: flex; align-items: center; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
    .episode-card-beat { margin: 7px 0; color: #6b6258; font-size: 11px; }
    .episode-card-stages { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin: 8px 0; }
    .episode-card-stages .stage-chip { width: 100%; }
    .episode-card .row-actions { border-top: 1px dashed var(--line); margin-top: 9px; padding-top: 9px; }

    .notice {
      display: none;
      max-height: 180px;
      overflow: auto;
      margin: 10px 14px 14px;
      border-radius: 8px;
      background: #faf5ee;
      padding: 9px 11px;
      white-space: pre-wrap;
      font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .notice.on { display: block; }
    .notice.bad { color: var(--bad); background: var(--bad-bg); }
    .empty { padding: 60px 20px; color: var(--muted); text-align: center; }
    .hidden { display: none !important; }
    .limit-hint { padding: 8px 14px; color: var(--warn); background: var(--warn-bg); font-size: 11px; }

    dialog {
      width: min(620px, calc(100% - 28px));
      max-height: calc(100vh - 36px);
      overflow: hidden;
      border: 0;
      border-radius: 13px;
      padding: 0;
      box-shadow: 0 20px 70px #0006;
    }
    dialog.wide { width: min(820px, calc(100% - 28px)); }
    dialog::backdrop { background: rgba(51,48,44,.62); }
    .dialog-head {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 54px;
      border-bottom: 1px solid var(--line);
      padding: 10px 16px;
    }
    .dialog-head h2 { margin: 0; font-size: 16px; }
    .dialog-body { max-height: calc(100vh - 170px); overflow: auto; padding: 14px 16px 18px; }
    .dialog-foot {
      display: flex;
      justify-content: flex-end;
      gap: 7px;
      border-top: 1px solid var(--line);
      background: #fdfaf5;
      padding: 10px 16px;
    }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px 12px; }
    .field.full { grid-column: 1 / -1; }
    .field label {
      display: block;
      margin: 0 0 4px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 750;
    }
    .field input, .field select, .field textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      padding: 7px 9px;
    }
    .field input, .field select { height: 36px; }
    .field textarea {
      min-height: 260px;
      resize: vertical;
      font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    details { margin-top: 13px; }
    details summary { cursor: pointer; color: var(--muted); font-size: 12px; font-weight: 700; }
    .conflicts { margin-top: 14px; }
    .conflicts > h3 { margin: 0 0 8px; font-size: 13px; }
    .conflict {
      margin: 7px 0;
      border: 1px solid #f0d3a9;
      border-radius: 8px;
      background: #fffbf3;
      padding: 9px;
    }
    .conflict .code { color: var(--warn); font: 650 11px ui-monospace, monospace; }
    .conflict p { margin: 3px 0 7px; font-size: 12px; }
    .conflict ul { margin: 4px 0 7px; padding-left: 18px; color: var(--muted); font-size: 11px; }
    .dialog-message { margin: 10px 0 0; }
    dialog.asset-dialog { width: min(1120px, calc(100% - 28px)); }
    .asset-heading { min-width: 0; }
    .asset-heading h2 {
      overflow: hidden;
      margin: 0;
      font-size: 16px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .asset-heading p {
      overflow: hidden;
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 11px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .asset-tabs {
      display: flex;
      align-items: center;
      gap: 5px;
      overflow-x: auto;
      border-bottom: 1px solid var(--line);
      background: #faf5ee;
      padding: 8px 12px;
    }
    .asset-tab {
      min-height: 34px;
      border: 1px solid transparent;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      padding: 6px 10px;
      white-space: nowrap;
    }
    .asset-tab:hover { border-color: var(--line); background: #fff; }
    .asset-tab[aria-selected="true"] {
      border-color: #eecfa8;
      background: var(--blue-soft);
      color: var(--blue);
      font-weight: 750;
    }
    .asset-tab:disabled { cursor: not-allowed; opacity: .45; }
    .asset-panel {
      min-height: 520px;
      max-height: calc(100vh - 190px);
      overflow: auto;
      background: #faf6f0;
      padding: 14px;
    }
    .asset-state {
      display: grid;
      min-height: 460px;
      place-items: center;
      color: var(--muted);
      text-align: center;
    }
    .asset-state strong { display: block; margin-bottom: 5px; color: var(--ink); }
    .asset-layout {
      display: grid;
      grid-template-columns: 270px minmax(0, 1fr);
      gap: 12px;
      min-height: 490px;
    }
    .asset-file-list {
      overflow: auto;
      max-height: calc(100vh - 230px);
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      padding: 6px;
    }
    .asset-file {
      width: 100%;
      display: block;
      border: 1px solid transparent;
      border-radius: 7px;
      background: transparent;
      color: var(--ink);
      padding: 7px 8px;
      text-align: left;
    }
    .asset-file:hover { border-color: var(--line); background: #faf5ee; }
    .asset-file.active { border-color: #eecfa8; background: var(--blue-soft); }
    .asset-file-name {
      display: block;
      overflow: hidden;
      font-size: 12px;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .asset-file-meta {
      display: block;
      overflow: hidden;
      margin-top: 2px;
      color: var(--muted);
      font-size: 10px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .asset-viewer {
      min-width: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
    }
    .asset-viewer-head {
      min-height: 43px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid var(--line);
      padding: 7px 10px;
    }
    .asset-viewer-head strong {
      overflow: hidden;
      font-size: 12px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .asset-viewer-head a {
      color: var(--blue);
      font-size: 11px;
      text-decoration: none;
      white-space: nowrap;
    }
    .asset-preview {
      min-height: 445px;
      max-height: calc(100vh - 275px);
      overflow: auto;
    }
    .asset-text {
      min-height: 445px;
      margin: 0;
      background: #2c2822;
      color: #f4ede2;
      padding: 14px;
      white-space: pre-wrap;
      word-break: break-word;
      font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .asset-visual {
      min-height: 445px;
      display: grid;
      place-items: center;
      background: #0b0d12;
      padding: 12px;
    }
    .asset-visual img {
      display: block;
      max-width: 100%;
      max-height: calc(100vh - 310px);
      object-fit: contain;
    }
    .asset-visual video {
      display: block;
      width: 100%;
      max-height: calc(100vh - 310px);
      background: #000;
    }
    .asset-audio {
      min-height: 445px;
      display: grid;
      align-content: center;
      gap: 16px;
      padding: 30px;
      text-align: center;
    }
    .asset-audio audio { width: min(620px, 100%); margin: 0 auto; }
    .asset-preview-error { color: #fda29b; font-size: 12px; }

    @media (max-width: 1050px) {
      .channel-toolbar { flex-wrap: wrap; }
      .channel-picker { width: min(520px, 60vw); }
      .summary-strip { order: 3; width: 100%; }
      .episode-table-wrap { max-height: calc(100vh - 330px); }
    }
    @media (max-width: 1024px) {
      .episode-table-wrap { display: none; }
      .episode-cards {
        display: grid;
        gap: 10px;
        background: #faf5ee;
        padding: 10px;
      }
      .episode-card .row-actions select { flex: 1 1 120px; width: auto; }
      .production-track { display: none; }
    }
    @media (max-width: 700px) {
      .top { padding: 0 12px; }
      .top h1 { font-size: 15px; }
      .top .live { display: none; }
      main { padding: 12px; }
      .channel-toolbar { align-items: flex-end; gap: 8px; }
      .channel-picker { order: 1; width: 100%; min-width: 0; }
      .channel-toolbar > .spacer { display: none; }
      .channel-meta { order: 2; width: 100%; min-width: 0; flex: none; }
      .summary-strip { order: 3; overflow-x: auto; flex-wrap: nowrap; }
      #refreshButton { order: 4; margin-left: 0; }
      #newChannelButton { order: 4; }
      .stat { min-width: 82px; }
      .workspace-head { align-items: flex-start; flex-wrap: wrap; }
      .workspace-actions { width: 100%; overflow-x: auto; }
      .episode-toolbar { align-items: stretch; flex-wrap: wrap; }
      .episode-toolbar .spacer { display: none; }
      .search { width: calc(100% - 138px); min-width: 180px; }
      .episode-card-stages { grid-template-columns: repeat(2, 1fr); }
      .form-grid { grid-template-columns: 1fr; }
      .field.full { grid-column: auto; }
      .dialog-foot { overflow-x: auto; justify-content: flex-start; }
      dialog.asset-dialog {
        width: calc(100% - 16px);
        max-height: calc(100dvh - 16px);
      }
      .asset-panel { max-height: calc(100dvh - 175px); padding: 8px; }
      .asset-layout { grid-template-columns: 1fr; min-height: 0; }
      .asset-file-list {
        display: flex;
        gap: 5px;
        max-height: none;
        overflow-x: auto;
      }
      .asset-file { min-width: 180px; width: 180px; }
      .asset-preview { min-height: 360px; max-height: none; }
      .asset-text, .asset-visual, .asset-audio { min-height: 360px; }
    }
  </style>
</head>
<body>
<header class="top">
  <span aria-hidden="true">🎬</span>
  <h1>BarroTube Channel Board</h1>
  <span class="spacer"></span>
  <span id="live" class="live" aria-live="polite">연결 확인 중…</span>
</header>

<main>
  <section class="channel-toolbar" aria-label="채널 선택과 관리">
    <div class="channel-picker">
      <label for="channelSelect">운영 채널</label>
      <select id="channelSelect" disabled>
        <option value="">채널을 불러오는 중…</option>
      </select>
    </div>
    <div id="channelMeta" class="channel-meta" aria-live="polite"></div>
    <div id="summary" class="summary-strip"></div>
    <span class="spacer"></span>
    <button id="refreshButton" class="btn icon" type="button" aria-label="채널 새로고침" title="새로고침">↻</button>
    <button id="newChannelButton" class="btn primary" type="button">+ 채널 등록</button>
  </section>

  <section class="panel" aria-labelledby="workspaceTitle">
    <div class="workspace-head">
      <div class="workspace-title">
        <h2 id="workspaceTitle">에피소드 운영</h2>
        <p id="workspaceSubtitle">채널을 선택하면 실제 산출물 기준 진행 상태를 표시합니다.</p>
      </div>
      <span class="spacer"></span>
      <div class="workspace-actions">
        <button id="settingsButton" class="btn" type="button" disabled>채널 설정</button>
        <button id="openDocumentButton" class="btn" type="button" disabled>설계문서</button>
        <button id="renderDocumentButton" class="btn" type="button" disabled>HTML 생성</button>
      </div>
    </div>

    <div id="empty" class="empty">채널 정보를 불러오는 중입니다.</div>
    <div id="workspaceBody" class="hidden">
      <div class="episode-toolbar">
        <strong>에피소드</strong>
        <span id="episodeCount" class="episode-count"></span>
        <span class="spacer"></span>
        <input id="episodeSearch" class="search" type="search" placeholder="ID 또는 제목 검색" aria-label="에피소드 검색">
        <select id="stageFilter" class="filter-select" aria-label="진행 단계 필터">
          <option value="">전체 단계</option>
        </select>
        <select id="episodeSort" class="filter-select" aria-label="정렬 기준">
          <option value="id">정렬: 에피소드 ID</option>
          <option value="episode_no">정렬: Day/회차</option>
          <option value="stage">정렬: 진행 단계</option>
          <option value="updated_at">정렬: 최근 수정</option>
          <option value="title">정렬: 제목</option>
        </select>
        <select id="episodeSortDir" class="filter-select" aria-label="정렬 방향">
          <option value="desc">내림차순 ↓</option>
          <option value="asc">오름차순 ↑</option>

      </div>
      <div id="episodeProductionSummary" class="production-summary" aria-label="에피소드 제작 요약"></div>
      <div class="episode-table-wrap">
        <table id="episodeTable">
          <caption>선택한 채널의 에피소드 운영 목록</caption>
          <colgroup>
            <col style="width:150px">
            <col style="width:260px">
            <col style="width:78px">
            <col style="width:72px">
            <col style="width:72px">
            <col style="width:72px">
            <col style="width:72px">
            <col style="width:84px">
            <col style="width:75px">
            <col style="width:92px">
            <col style="width:375px">
          </colgroup>
          <thead>
            <tr>
              <th scope="col" rowspan="2">Day / 에피소드</th>
              <th scope="col" rowspan="2">에피소드 (폴더)</th>
              <th scope="col" rowspan="2">포맷</th>
              <th scope="colgroup" colspan="4" class="generation-head">영상 생성</th>
              <th scope="col" rowspan="2">영상 확인</th>

              <th scope="col" rowspan="2">관리</th>
            </tr>
            <tr>
              <th scope="col">대본</th>
              <th scope="col">이미지</th>

          <tbody id="episodes">

    <div class="asset-state" role="status">자산을 불러오는 중…</div>
  </section>

<script>
'use strict';

var TOKEN = (document.querySelector('meta[name="barrotube-board-token"]') || {}).content || '';
var DATA = [];
var CURRENT = null;
var DETAIL = null;
var EPISODE_GROUPS = [];
var VARIANT_BY_EPISODE = Object.create(null);
var PLATFORM_BY_VARIANT = Object.create(null);
var EPISODE_META = {};
var REQUEST_SEQUENCE = 0;
var EPISODE_LIMIT = 500;
var ASSET_REQUEST_SEQUENCE = 0;
var ASSET_TEXT_SEQUENCE = 0;
var ASSET_RENDER_SEQUENCE = 0;
var ASSET_TEXT_LIMIT = 250000;
var ASSET_STATE = null;
var ASSET_RETURN_FOCUS = null;
var ASSET_TABS = [
  { id: 'script', label: '스크립트', groups: ['script'] },
  { id: 'images', label: '이미지', groups: ['images', 'cards'] },
  { id: 'videos', label: '영상', groups: ['render', 'videos'] },
  { id: 'audio', label: '오디오', groups: ['audio'] },
  { id: 'distribution', label: '배포본', groups: ['distribution'] },
  { id: 'documents', label: '문서', groups: ['reports', 'metadata', 'other'] }
];

function esc(value) {
  return String(value == null ? '' : value).replace(/[&<>"']/g, function (character) {
    return {
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    }[character];
  });
}

function headers(extra) {
  return Object.assign({ 'X-BarroTube-Token': TOKEN }, extra || {});
}

function api(url, options) {
  options = options || {};
  options.headers = headers(options.headers);
  return fetch(url, options).then(async function (response) {
    var text = await response.text();
    var data;
    try {
      data = JSON.parse(text);
    } catch (_error) {
      data = { error: text || response.statusText };
    }
    if (!response.ok) throw new Error(data.error || ('HTTP ' + response.status));
    return data;
  });
}

function statusClass(status) {
  if (status === 'active') return 'active';
  if (status === 'archived') return 'archived';
  return 'review';
}

function stageClass(stage) {
  return ['published', 'approval', 'qa-passed', 'qa', 'planned', 'assets', 'production', 'render', 'script'].indexOf(stage) >= 0
    ? stage
    : 'planned';
}

function channelId(record) {
  return record && (record.id || record.manifest && record.manifest.id) || '';
}

function channelName(record) {
  return record && (
    record.identity && record.identity.display_name
    || record.context && record.context.identity && record.context.identity.display_name
    || channelId(record)
  ) || '';
}

function currentSummary() {
  return DATA.find(function (record) { return channelId(record) === CURRENT; }) || null;
}

function groupEpisodes(items) {
  var groups = [];
  var byId = Object.create(null);
  (items || []).forEach(function (episode, index) {
    var rawId = episode && (episode.id || episode.episode_id);
    var key = rawId ? String(rawId) : '__missing_episode_' + index;
    var profile = String(episode && episode.source_profile || 'unknown');
    var group = byId[key];
    if (!group) {
      group = {
        key: key,
        id: rawId || '(ID 없음)',
        variants: [],
        profileSeen: Object.create(null),
        duplicateProfiles: []
      };
      byId[key] = group;
      groups.push(group);
    }
    if (group.profileSeen[profile]) {
      if (group.duplicateProfiles.indexOf(profile) < 0) group.duplicateProfiles.push(profile);
      return;
    }
    group.profileSeen[profile] = true;
    group.variants.push(episode);
  });
  return groups;
}

function selectedVariant(group) {
  var requested = VARIANT_BY_EPISODE[group.key];
  var selected = group.variants.find(function (episode) {
    return String(episode.source_profile || 'unknown') === requested;
  });
  return selected || group.variants[0] || {};
}

function conflictEntries(manifest, detail) {
  var configured = manifest && manifest.migration && Array.isArray(manifest.migration.conflicts)
    ? manifest.migration.conflicts
    : [];
  var combined = detail && Array.isArray(detail.conflicts)
    ? detail.conflicts
    : configured;
  return combined.map(function (conflict, index) {
    return {
      conflict: conflict,
      manifestIndex: index < configured.length ? index : null
    };
  });
}

function renderChannelMenu() {
  var select = document.getElementById('channelSelect');
  if (!DATA.length) {
    select.innerHTML = '<option value="">등록된 채널이 없습니다.</option>';
    select.disabled = true;
    renderChannelSummary();
    return;
  }
  select.disabled = false;
  select.innerHTML = DATA.map(function (record) {
    var id = channelId(record);
    var total = record.board_episode_count == null ? record.episode_count || 0 : record.board_episode_count;
    var label = channelName(record) + ' — ' + id + ' · ' + total + ' EP';
    return '<option value="' + esc(id) + '">' + esc(label) + '</option>';
  }).join('');
  select.value = CURRENT || channelId(DATA[0]);
  renderChannelSummary();
}

function renderChannelSummary() {
  var record = currentSummary();
  var meta = document.getElementById('channelMeta');
  var summary = document.getElementById('summary');
  if (!record) {
    meta.innerHTML = '';
    summary.innerHTML = '';
    return;
  }
  var status = record.status || record.manifest && record.manifest.status || 'needs_review';
  var profile = record.pipeline_profile || record.context && record.context.pipeline_profile || '';
  meta.innerHTML =
    '<span class="pill ' + statusClass(status) + '">' + esc(status) + '</span>'
    + '<span class="channel-profile">' + esc(profile) + '</span>'
    + '<span class="revision">rev ' + esc(record.revision || 0) + '</span>';
  summary.innerHTML = [
    [record.board_episode_count == null ? record.episode_count || 0 : record.board_episode_count, '전체'],
    [record.episode_count || 0, '실측'],
    [record.published_count || 0, '발행'],
    [record.unresolved || 0, '미해결']
  ].map(function (item) {
    return '<span class="stat"><b>' + item[0] + '</b>' + item[1] + '</span>';
  }).join('');
}

function setWorkspaceEnabled(enabled) {
  ['settingsButton', 'openDocumentButton', 'renderDocumentButton'].forEach(function (id) {
    document.getElementById(id).disabled = !enabled;
  });
  document.getElementById('empty').classList.toggle('hidden', enabled);
  document.getElementById('workspaceBody').classList.toggle('hidden', !enabled);
}

async function loadAll() {
  try {
    var response = await api('/api/channels');
    DATA = response.channels || response || [];
    document.getElementById('live').textContent = '연결됨 · ' + DATA.length + '개 채널';
    var currentExists = DATA.some(function (record) { return channelId(record) === CURRENT; });
    CURRENT = currentExists ? CURRENT : (DATA.length ? channelId(DATA[0]) : null);
    renderChannelMenu();
    if (CURRENT) {
      await selectChannel(CURRENT);
    } else {
      DETAIL = null;
      EPISODE_GROUPS = [];
      EPISODE_META = {};
      setWorkspaceEnabled(false);
      document.getElementById('empty').textContent = '등록된 채널이 없습니다. 채널 등록 버튼으로 시작하세요.';
    }
  } catch (error) {
    document.getElementById('live').textContent = '연결 실패';
    setWorkspaceEnabled(false);
    document.getElementById('empty').textContent = error.message;
  }
}

async function selectChannel(id) {
  if (!id) return;
  var sequence = ++REQUEST_SEQUENCE;
  CURRENT = id;
  document.getElementById('channelSelect').value = id;
  renderChannelSummary();
  setWorkspaceEnabled(true);
  document.getElementById('workspaceTitle').textContent = channelName(currentSummary()) || id;
  document.getElementById('workspaceSubtitle').textContent = id + ' · 정보를 불러오는 중…';
  document.getElementById('episodes').innerHTML = '<tr><td colspan="11" class="empty">불러오는 중…</td></tr>';
  document.getElementById('episodeCards').innerHTML = '<div class="empty">불러오는 중…</div>';
  document.getElementById('episodeProductionSummary').innerHTML = '';
  showMessage('');
  try {
    var results = await Promise.all([
      api('/api/channels/' + encodeURIComponent(id)),
      api('/api/channels/' + encodeURIComponent(id) + '/episodes')
    ]);
    if (sequence !== REQUEST_SEQUENCE || CURRENT !== id) return;
    DETAIL = results[0];
    var manifest = DETAIL.manifest || DETAIL.channel || DETAIL;
    EPISODE_META = results[1] && !Array.isArray(results[1]) ? results[1] : {};
    var episodes = results[1].board_episodes || results[1].episodes || results[1] || [];
    EPISODE_GROUPS = groupEpisodes(episodes.slice(0, EPISODE_LIMIT));
    populateSettings(manifest);
    renderStageFilter();
    renderEpisodes();
    document.getElementById('workspaceTitle').textContent =
      manifest.identity && manifest.identity.display_name || id;
    document.getElementById('workspaceSubtitle').textContent =
      id + ' · revision ' + (manifest.revision || 0) + ' · 계획 ' + Number(EPISODE_META.planned_count || 0)
      + ' · 실측 ' + Number(EPISODE_META.observed_count == null ? episodes.length : EPISODE_META.observed_count);
    var limitHint = document.getElementById('limitHint');
    limitHint.classList.toggle('hidden', episodes.length <= EPISODE_LIMIT);
    limitHint.textContent = episodes.length > EPISODE_LIMIT
      ? '전체 ' + episodes.length + '개 중 최근 ' + EPISODE_LIMIT + '개만 표시합니다.'
      : '';
  } catch (error) {
    if (sequence !== REQUEST_SEQUENCE) return;
    DETAIL = null;
    EPISODE_GROUPS = [];
    EPISODE_META = {};
    document.getElementById('episodes').innerHTML =
      '<tr><td colspan="11" class="empty">' + esc(error.message) + '</td></tr>';
    document.getElementById('episodeCards').innerHTML =
      '<div class="empty">' + esc(error.message) + '</div>';
    document.getElementById('episodeProductionSummary').innerHTML = '';
    showMessage(error.message, true);
  }
}

function renderStageFilter() {
  var select = document.getElementById('stageFilter');
  var previous = select.value;
  var stages = Object.create(null);
  EPISODE_GROUPS.forEach(function (group) {
    stages[episodeDisplayStage(group, selectedVariant(group))] = true;
  });
  select.innerHTML = '<option value="">전체 단계</option>'
    + Object.keys(stages).sort().map(function (stage) {
      return '<option value="' + esc(stage) + '">' + esc(stageLabel(stage)) + '</option>';
    }).join('');
  if (stages[previous]) select.value = previous;
}

function selectedEpisodePlatform(group, episode) {
  var platforms = Object.keys(episode.artifacts && episode.artifacts.platforms || {});
  if (!platforms.length) return null;
  var key = group.key + '::' + String(episode.source_profile || 'unknown');
  var requested = PLATFORM_BY_VARIANT[key];
  return platforms.indexOf(requested) >= 0 ? requested : platforms[0];
}

function visibleArtifacts(group, episode) {
  var platform = selectedEpisodePlatform(group, episode);
  return platform && episode.artifacts && episode.artifacts.platforms
    ? episode.artifacts.platforms[platform] || episode.artifacts
    : episode.artifacts || {};
}

function episodeFormat(episode) {
  var format = String(episode.planned_format || episode.format || 'unspecified').toLowerCase();
  if (format === 'car') format = 'carousel';
  if (format === 'reels') format = 'reel';
  return format;
}

function stageLabel(stage) {
  return {
    planned: '계획', script: '대본', assets: '제작중', production: '제작중', render: '생성완료',
    qa: 'QA진행', 'qa-passed': 'QA통과', approval: '승인대기', published: '발행완료'
  }[stage] || stage || '계획';
}

function stageValue(episode, artifacts, kind) {
  var format = episodeFormat(episode);
  if (format === 'carousel' && (kind === 'video' || kind === 'render')) return { na: true };
  var value;
  if (kind === 'script') value = artifacts.script;
  if (kind === 'image') value = artifacts.images != null ? artifacts.images : artifacts.slides;
  if (kind === 'video') value = artifacts.videos;
  if (kind === 'render') value = artifacts.render;
  var counts = episode.planned_counts || {};
  var stages = episode.planned_stages || {};
  var plannedCount = null;
  if (kind === 'image') {
    if (Number.isFinite(Number(counts.images))) plannedCount = Number(counts.images);
    else if (Number.isFinite(Number(counts.slides))) plannedCount = Number(counts.slides);
    else if (Number.isFinite(Number(counts.stills))) plannedCount = Number(counts.stills);
  }
  if (kind === 'video') {
    if (Number.isFinite(Number(counts.videos))) plannedCount = Number(counts.videos);
    else if (Number.isFinite(Number(counts.clips))) plannedCount = Number(counts.clips);
  }
  var total = 0;
  if (kind === 'image') total = Number(format === 'carousel' ? counts.slides || counts.cuts || 0 : counts.cuts || 0);
  if (kind === 'video') total = Number(counts.cuts || 0);
  var actualCount = typeof value === 'number' ? value : null;
  var count;
  if (episode.observed === false) count = plannedCount !== null ? plannedCount : actualCount;
  else if (actualCount !== null && actualCount > 0) count = total ? Math.min(actualCount, total) : actualCount;
  else if (actualCount === 0 && stages[kind] === false && plannedCount > 0) count = plannedCount;
  else count = actualCount;
  var plannedDone = episode.observed === false && stages[kind] === true;
  var done = value === true || plannedDone
    || count !== null && count > 0 && (!total || count >= total);
  var part = !done && count !== null && count > 0;
  return { value: value, count: count, total: total, done: done, part: part, na: false };
}

function stageChipHtml(episode, artifacts, kind) {
  var labels = { script: '대본', image: '이미지', video: '영상', render: '렌더' };
  var state = stageValue(episode, artifacts, kind);
  if (state.na) return '<span class="stage-chip na">—</span>';
  var suffix = '';
  if (state.count !== null && state.total) suffix = ' ' + state.count + '/' + state.total;
  else if (state.count !== null && state.count > 0) suffix = ' ' + state.count;
  else if (state.done) suffix = ' ✓';
  return '<span class="stage-chip' + (state.done ? ' done' : state.part ? ' part' : '') + '">'
    + labels[kind] + suffix + '</span>';
}

function qaBadgeHtml(episode) {
  var qa = episode.qa || {};
  var state = humanQaState(episode);
  var badge;
  if (state.passed) badge = '<span class="qa-badge pass">통과 ✓</span>';
  else if (state.tracked) badge = '<span class="qa-badge' + (state.checked ? ' part' : '') + '">'
    + state.checked + ' / ' + state.total + '</span>';
  else if (qa.status === 'fail' || qa.passed === false && qa.exists) {
    badge = '<span class="qa-badge fail">검수 필요</span>';
  } else badge = '<span class="qa-badge">미검수</span>';
  var automatic = episode.planned_qa_auto;
  if (automatic == null && state.tracked && qa.exists) automatic = qa.passed === true;
  var autoBadge = state.tracked && automatic != null
    ? '<span class="qa-auto ' + (automatic ? 'pass' : 'fail') + '">자동 '
      + (automatic ? '✓' : '✗') + '</span>'
    : '';
  return '<span class="qa-stack">' + badge + autoBadge + '</span>';
}

function humanQaState(episode) {
  var total = Number(episode.qa_check_count || 0);
  var checked = Number(episode.qa_checked_count || 0);
  if (total > 0) {
    return {
      tracked: true,
      total: total,
      checked: checked,
      passed: episode.human_qa_passed === true || checked >= total
    };
  }
  return {
    tracked: false,
    total: 0,
    checked: 0,
    passed: Boolean(episode.qa && episode.qa.passed)
  };
}

function episodePublished(episode) {
  return Boolean(episode.publish && episode.publish.published || episode.planned_published);
}

function episodeDisplayStage(group, episode) {
  if (episodePublished(episode)) return 'published';
  var qaState = humanQaState(episode);
  if (qaState.tracked) {
    if (qaState.passed) return 'qa-passed';
    if (qaState.checked > 0) return 'qa';
    if (generationComplete(group, episode)) return 'render';
    var artifacts = visibleArtifacts(group, episode);
    var started = ['script', 'image', 'video', 'render'].some(function (kind) {
      var state = stageValue(episode, artifacts, kind);
      return !state.na && (state.done || state.part);
    });
    return started ? 'assets' : 'planned';
  }
  return episode.lifecycle_stage || episode.native_stage || 'planned';
}

function formatBadgeHtml(episode) {
  var format = episodeFormat(episode);
  var label = { reel: '릴스', carousel: '캐러셀', shorts: '쇼츠', long: '롱폼' }[format] || format;
  return '<span class="format-badge ' + esc(format) + '">' + esc(label) + '</span>';
}

function episodeProfileHtml(group, groupIndex, episode) {
  var id = episode.id || episode.episode_id || group.id;
  var profile = String(episode.source_profile || 'unknown');
  if (group.variants.length > 1) {
    return '<select class="episode-profile-select" data-role="profile" data-group-index="' + groupIndex
      + '" aria-label="' + esc(id) + ' 파이프라인 선택">'
      + group.variants.map(function (variant) {
        var value = String(variant.source_profile || 'unknown');
        return '<option value="' + esc(value) + '"' + (value === profile ? ' selected' : '') + '>'
          + esc(value) + '</option>';
      }).join('') + '</select>';
  }
  return '<span class="episode-profile">' + (episode.observed === false ? '계획 · ' : '')
    + esc(profile) + '</span>';
}

function episodeActionsHtml(group, groupIndex, episode) {
  var id = episode.id || episode.episode_id || group.id;
  var ambiguous = group.duplicateProfiles.length > 0;
  var actionable = episode.observed !== false && episode.assets_available !== false;
  var supported = Array.isArray(episode.supported_actions) ? episode.supported_actions : [];
  var assetDisabled = ambiguous || !actionable ? ' disabled' : '';
  var actionDisabled = ambiguous || !actionable || !supported.length ? ' disabled' : '';
  var actions = supported.length
    ? supported.map(function (action) {
      return '<option value="' + esc(action) + '">' + esc(action) + '</option>';
    }).join('')
    : '<option value="">실측 후 실행 가능</option>';
  var platforms = Object.keys(episode.artifacts && episode.artifacts.platforms || {});
  var selectedPlatform = selectedEpisodePlatform(group, episode);
  var platformSelect = platforms.length
    ? '<select class="platform" data-role="platform" data-group-index="' + groupIndex
      + '" aria-label="' + esc(id) + ' 플랫폼 선택"' + assetDisabled + '>'
      + platforms.map(function (platform) {
        return '<option value="' + esc(platform) + '"' + (platform === selectedPlatform ? ' selected' : '') + '>'
          + esc(platform) + '</option>';
      }).join('') + '</select>'
    : '';
  return '<div class="row-actions">'
    + '<select data-role="action" aria-label="' + esc(id) + ' 작업 선택"' + actionDisabled + '>' + actions + '</select>'
    + platformSelect
    + '<button class="btn small" type="button" data-command="dry-run" data-group-index="' + groupIndex
    + '"' + actionDisabled + '>검증</button>'
    + '<button class="btn small primary" type="button" data-command="run" data-group-index="' + groupIndex
    + '"' + actionDisabled + '>실행</button>'
    + '<button class="btn small" type="button" data-command="assets" data-group-index="' + groupIndex
    + '"' + assetDisabled + '>자산</button></div>';
}

function episodeIdentityHtml(group, groupIndex, episode) {
  var id = episode.id || episode.episode_id || group.id;
  var day = episode.episode_no
    ? '<span class="episode-day">Day ' + Number(episode.episode_no)
      + (episode.weekday ? ' · ' + esc(episode.weekday) : '') + '</span>'
    : '';
  var date = episode.schedule_date
    ? '<span class="episode-date">' + esc(episode.schedule_date) + '</span>' : '';
  var warning = group.duplicateProfiles.length
    ? '<span class="duplicate-warning">동일 파이프라인 중복 · 실행 차단</span>'
    : '';
  return '<div class="episode-id">' + day + date + '<strong>' + esc(id) + '</strong>'
    + episodeProfileHtml(group, groupIndex, episode) + warning + '</div>';
}

function episodeContentHtml(episode) {
  var title = episode.planned_title || episode.title || episode.topic || '(제목 없음)';
  return '<span class="episode-title" title="' + esc(title) + '">' + esc(title) + '</span>'
    + (episode.folder || episode.slug
      ? '<span class="episode-folder">' + esc(episode.folder || episode.slug) + '</span>' : '')
    + (episode.arc_beat ? '<span class="episode-beat" title="' + esc(episode.arc_beat) + '">'
      + esc(episode.arc_beat) + '</span>' : '');
}

function episodeRowHtml(group, groupIndex) {
  var episode = selectedVariant(group);
  var artifacts = visibleArtifacts(group, episode);
  var stage = episodeDisplayStage(group, episode);
  var published = episodePublished(episode);
  return '<tr data-episode-item data-episode-key="' + esc(group.key) + '" data-group-index="' + groupIndex
    + '" class="' + (episode.observed === false ? 'planned-row' : '') + '">'
    + '<td>' + episodeIdentityHtml(group, groupIndex, episode) + '</td>'
    + '<td>' + episodeContentHtml(episode) + '</td>'
    + '<td>' + formatBadgeHtml(episode) + '</td>'
    + '<td class="stage-cell">' + stageChipHtml(episode, artifacts, 'script') + '</td>'
    + '<td class="stage-cell">' + stageChipHtml(episode, artifacts, 'image') + '</td>'
    + '<td class="stage-cell">' + stageChipHtml(episode, artifacts, 'video') + '</td>'
    + '<td class="stage-cell">' + stageChipHtml(episode, artifacts, 'render') + '</td>'
    + '<td class="stage-cell">' + qaBadgeHtml(episode) + '</td>'
    + '<td class="stage-cell"><span class="publish-mark' + (published ? ' done' : '') + '">'
      + (published ? '발행 ✓' : '—') + '</span></td>'
    + '<td><span class="pill ' + stageClass(stage) + '" title="' + esc(stage) + '">'
      + esc(stageLabel(stage)) + '</span></td>'
    + '<td>' + episodeActionsHtml(group, groupIndex, episode) + '</td></tr>';
}

function episodeCardHtml(group, groupIndex) {
  var episode = selectedVariant(group);
  var artifacts = visibleArtifacts(group, episode);
  var stage = episodeDisplayStage(group, episode);
  var published = episodePublished(episode);
  return '<article class="episode-card' + (episode.observed === false ? ' planned-row' : '')
    + '" data-episode-item data-episode-key="' + esc(group.key) + '" data-group-index="' + groupIndex + '">'
    + '<div class="episode-card-head"><div class="episode-card-title">'
    + (episode.episode_no ? '<span class="episode-day">Day ' + Number(episode.episode_no)
      + (episode.weekday ? ' · ' + esc(episode.weekday) : '') + '</span>' : '')
    + (episode.schedule_date ? '<span class="episode-date">' + esc(episode.schedule_date) + '</span>' : '')
    + '<strong>' + esc(episode.planned_title || episode.title || episode.topic || '(제목 없음)') + '</strong>'
    + (episode.folder || episode.slug ? '<span class="episode-folder">' + esc(episode.folder || episode.slug)
      + '</span>' : '') + '</div><span class="pill ' + stageClass(stage) + '">'
      + esc(stageLabel(stage)) + '</span></div>'
    + '<div class="episode-card-meta"><strong>' + esc(episode.id || episode.episode_id || group.id) + '</strong>'
      + formatBadgeHtml(episode) + qaBadgeHtml(episode)
      + '<span class="publish-mark' + (published ? ' done' : '') + '">' + (published ? '발행 ✓' : '미발행')
      + '</span></div>'
    + (episode.arc_beat ? '<p class="episode-card-beat">' + esc(episode.arc_beat) + '</p>' : '')
    + '<div class="episode-card-stages">' + ['script', 'image', 'video', 'render'].map(function (kind) {
      return stageChipHtml(episode, artifacts, kind);
    }).join('') + '</div>'
    + episodeProfileHtml(group, groupIndex, episode)
    + (group.duplicateProfiles.length ? '<span class="duplicate-warning">동일 파이프라인 중복 · 실행 차단</span>' : '')
    + episodeActionsHtml(group, groupIndex, episode) + '</article>';
}

function generationComplete(group, episode) {
  var artifacts = visibleArtifacts(group, episode);
  var required = episodeFormat(episode) === 'carousel'
    ? ['script', 'image'] : ['script', 'image', 'video', 'render'];
  return required.every(function (kind) { return stageValue(episode, artifacts, kind).done; });
}

function renderEpisodeProductionSummary() {
  var selected = EPISODE_GROUPS.map(function (group) {
    return { group: group, episode: selectedVariant(group) };
  });
  var total = selected.length || 1;
  var generated = selected.filter(function (item) { return generationComplete(item.group, item.episode); }).length;
  var qa = selected.filter(function (item) { return humanQaState(item.episode).passed; }).length;
  var published = selected.filter(function (item) { return episodePublished(item.episode); }).length;
  var buffer = selected.filter(function (item) {
    return humanQaState(item.episode).passed && !episodePublished(item.episode);
  }).length;
  var observed = Number(EPISODE_META.observed_count == null
    ? selected.filter(function (item) { return item.episode.observed !== false; }).length
    : EPISODE_META.observed_count);
  var publishedOnly = selected.filter(function (item) { return episodePublished(item.episode); }).length;
  var qaOnly = selected.filter(function (item) {
    return !episodePublished(item.episode) && humanQaState(item.episode).passed;
  }).length;
  var generatedOnly = selected.filter(function (item) {
    return !episodePublished(item.episode) && !humanQaState(item.episode).passed
      && generationComplete(item.group, item.episode);
  }).length;
  document.getElementById('episodeProductionSummary').innerHTML = [
    [generated + ' / ' + selected.length, '생성완료'],
    [qa + ' / ' + selected.length, 'QA 통과'],
    [published + ' / ' + selected.length, '발행완료'],
    [buffer + '화', '발행 대기'],
    [observed + ' / ' + selected.length, '실측 / 전체']
  ].map(function (item) {
    return '<span class="production-stat"><b>' + item[0] + '</b>' + item[1] + '</span>';
  }).join('')
    + '<span class="production-track" aria-hidden="true">'
    + '<span class="published" style="width:' + (publishedOnly / total * 100) + '%"></span>'
    + '<span class="qa" style="width:' + (qaOnly / total * 100) + '%"></span>'
    + '<span class="generated" style="width:' + (generatedOnly / total * 100) + '%"></span></span>';
}

/* ── 정렬 ──
 * 단계는 알파벳 비교가 무의미하다 — approval < assets < planned < published 로 정렬돼
 * 제작 진행 순서가 뒤섞인다. stageLabel 이 정의한 진행 순서를 그대로 순위로 쓴다.
 * 값이 없는 필드(episode_no 는 64개 중 17개만, updated_at 도 누락 가능)는 -1 로 밀어
 * 내림차순에서 항상 뒤로 보낸다.
 */
var STAGE_ORDER = ['planned', 'script', 'assets', 'production', 'render', 'qa', 'qa-passed', 'approval', 'published'];

function episodeSortValue(entry, key) {
  var episode = entry.episode || {};
  if (key === 'stage') return STAGE_ORDER.indexOf(entry.stage);
  if (key === 'episode_no') {
    var no = Number(episode.episode_no);
    return isFinite(no) ? no : -1;
  }
  if (key === 'updated_at') {
    var at = Date.parse(episode.updated_at || '');
    return isNaN(at) ? -1 : at;
  }
  if (key === 'title') return String(episode.title || '');
  return String(entry.group.id || '');
}

function sortEpisodeEntries(entries, key, dir) {
  var d = dir === 'asc' ? 1 : -1;
  return entries.sort(function (a, b) {
    var x = episodeSortValue(a, key);
    var y = episodeSortValue(b, key);
    var c = typeof x === 'string'
      ? x.localeCompare(y, 'ko')
      : (x < y ? -1 : x > y ? 1 : 0);
    if (!c) c = String(a.group.id).localeCompare(String(b.group.id), 'ko');  // 동점은 EP ID 로 갈음
    return c * d;
  });
}

function renderEpisodes() {
  var term = document.getElementById('episodeSearch').value.trim().toLowerCase();
  var stageFilter = document.getElementById('stageFilter').value;
  var visible = EPISODE_GROUPS.map(function (group, index) {
    var variant = selectedVariant(group);
    return {
      group: group, index: index, episode: variant,
      stage: episodeDisplayStage(group, variant),
    };
  }).filter(function (entry) {
    var episode = entry.episode;
    var stage = entry.stage;
    var haystack = [
      entry.group.id,
      episode.title,
      episode.planned_title,
      episode.topic,
      episode.episode_no,
      episode.slug,
      episode.folder,
      episode.arc_beat,
      episode.weekday,
      episode.format,
      episode.planned_format,
      episode.schedule_date,
      episode.source_profile,
      episode.lifecycle_stage,
      episode.native_stage,
      stage,
      stageLabel(stage)
    ].join(' ').toLowerCase();
    return (!term || haystack.indexOf(term) >= 0) && (!stageFilter || stage === stageFilter);
  });
  sortEpisodeEntries(visible, document.getElementById('episodeSort').value,
                              document.getElementById('episodeSortDir').value);
  document.getElementById('episodeCount').textContent =
    visible.length + ' / ' + EPISODE_GROUPS.length + '개';
  renderEpisodeProductionSummary();
  document.getElementById('episodes').innerHTML = visible.length
    ? visible.map(function (entry) { return episodeRowHtml(entry.group, entry.index); }).join('')
    : '<tr><td colspan="11" class="empty">조건에 맞는 에피소드가 없습니다.</td></tr>';
  document.getElementById('episodeCards').innerHTML = visible.length
    ? visible.map(function (entry) { return episodeCardHtml(entry.group, entry.index); }).join('')
    : '<div class="empty">조건에 맞는 에피소드가 없습니다.</div>';
}

function populateSettings(manifest) {
  document.getElementById('settingsDialogTitle').textContent =
    (manifest.identity && manifest.identity.display_name || manifest.id || CURRENT) + ' 설정';
  document.getElementById('settingsRevision').textContent = 'revision ' + (manifest.revision || 0);
  document.getElementById('name').value = manifest.identity && manifest.identity.display_name || '';
  document.getElementById('handle').value = manifest.identity && manifest.identity.handle || '';
  document.getElementById('description').value = manifest.identity && manifest.identity.description || '';
  document.getElementById('status').value = manifest.status || 'needs_review';
  document.getElementById('defaultFormat').value = manifest.formats && manifest.formats.default || '';
  document.getElementById('json').value = JSON.stringify(manifest, null, 2);
  renderConflicts(conflictEntries(manifest, DETAIL));
  document.getElementById('activateButton').disabled =
    (DETAIL && DETAIL.unresolved || 0) > 0 || manifest.status === 'active';
  showDialogMessage('settingsMsg', '');
}

function renderConflicts(entries) {
  var box = document.getElementById('conflicts');
  if (!entries.length) {
    box.innerHTML = '<h3>충돌</h3><div class="muted">미해결 충돌이 없습니다.</div>';
    return;
  }
  box.innerHTML = '<h3>검토 충돌 ' + entries.length + '건</h3>' + entries.map(function (entry, index) {
    var conflict = entry.conflict || entry;
    var candidates = (conflict.candidates || []).map(function (candidate) {
      var value = candidate && typeof candidate === 'object' ? candidate.value : candidate;
      var source = candidate && typeof candidate === 'object' ? candidate.source : '';
      return '<li>' + esc(value) + (source ? ' <small>(' + esc(source) + ')</small>' : '') + '</li>';
    }).join('');
    var resolution = Number.isInteger(entry.manifestIndex)
      ? '<div class="field"><label for="resolution-' + index + '">확정값 또는 처리 메모</label>'
        + '<input id="resolution-' + index + '" data-manifest-resolution="' + entry.manifestIndex
        + '" value="' + esc(conflict.resolution || '') + '"></div>'
      : '<div class="muted">자동 진단 충돌입니다. 관련 채널 설정을 수정하면 해소됩니다.</div>';
    return '<div class="conflict">'
      + '<div class="code">' + esc(conflict.field || conflict.path || conflict.code || 'conflict') + '</div>'
      + '<p>' + esc(conflict.reason || conflict.message || conflict.code || '검토가 필요합니다.') + '</p>'
      + (candidates ? '<ul>' + candidates + '</ul>' : '')
      + resolution
      + '</div>';
  }).join('');
}

function openSettings() {
  if (!DETAIL) return;
  var manifest = DETAIL.manifest || DETAIL.channel || DETAIL;
  populateSettings(manifest);
  document.getElementById('settingsDialog').showModal();
}

function mergedManifest() {
  var manifest;
  try {
    manifest = JSON.parse(document.getElementById('json').value);
  } catch (_error) {
    throw new Error('고급 JSON 형식이 올바르지 않습니다.');
  }
  manifest.identity = manifest.identity || {};
  manifest.identity.display_name = document.getElementById('name').value.trim();
  manifest.identity.handle = document.getElementById('handle').value.trim();
  manifest.identity.description = document.getElementById('description').value.trim();
  manifest.status = document.getElementById('status').value;
  manifest.formats = manifest.formats || {};
  manifest.formats.default = document.getElementById('defaultFormat').value.trim() || null;
  document.querySelectorAll('[data-manifest-resolution]').forEach(function (element) {
    var index = Number(element.dataset.manifestResolution);
    if (manifest.migration && manifest.migration.conflicts && manifest.migration.conflicts[index]) {
      manifest.migration.conflicts[index].resolution = element.value.trim() || null;
    }
  });
  return manifest;
}

async function saveChannel(event) {
  if (event) event.preventDefault();
  try {
    var manifest = mergedManifest();
    var revision = (DETAIL.manifest || DETAIL.channel || DETAIL).revision;
    await api('/api/channels/' + encodeURIComponent(CURRENT), {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'If-Match': String(revision) },
      body: JSON.stringify({ manifest: manifest, expected_revision: revision })
    });
    document.getElementById('settingsDialog').close();
    await loadAll();
    showMessage('채널 설정을 저장했습니다.');
  } catch (error) {
    showDialogMessage('settingsMsg', error.message, true);
  }
}

async function activateChannel() {
  try {
    var manifest = DETAIL.manifest || DETAIL.channel || DETAIL;
    await api('/api/channels/' + encodeURIComponent(CURRENT) + '/activate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'If-Match': String(manifest.revision) },
      body: JSON.stringify({ expected_revision: manifest.revision })
    });
    document.getElementById('settingsDialog').close();
    await loadAll();
    showMessage('채널을 활성화했습니다.');
  } catch (error) {
    showDialogMessage('settingsMsg', error.message, true);
  }
}

async function reloadEpisodes() {
  var id = CURRENT;
  var response = await api('/api/channels/' + encodeURIComponent(id) + '/episodes');
  if (CURRENT !== id) return;
  EPISODE_META = response && !Array.isArray(response) ? response : {};
  var episodes = response.board_episodes || response.episodes || response || [];
  EPISODE_GROUPS = groupEpisodes(episodes.slice(0, EPISODE_LIMIT));
  renderStageFilter();
  renderEpisodes();
}

async function runEpisodeAction(groupIndex, dryRun, item) {
  var group = EPISODE_GROUPS[groupIndex];
  if (!group || group.duplicateProfiles.length) {
    showMessage('동일 ID와 파이프라인의 에피소드가 중복되어 실행할 수 없습니다.', true);
    return;
  }
  var episode = selectedVariant(group);
  if (episode.observed === false || episode.assets_available === false) {
    showMessage('아직 실제 산출물이 없는 계획 에피소드입니다.', true);
    return;
  }
  var actionSelect = item && item.querySelector('[data-role="action"]');
  var platformSelect = item && item.querySelector('[data-role="platform"]');
  var action = actionSelect && actionSelect.value;
  if (!action) return;
  var payload = {
    episode_id: episode.id || episode.episode_id,
    source_profile: episode.source_profile,
    dry_run: !!dryRun
  };
  var platform = platformSelect ? platformSelect.value : selectedEpisodePlatform(group, episode);
  if (platform) payload.platform = platform;
  if (action === 'publish') {
    if (dryRun) {
      payload.confirm = 'PUBLISH';
    } else {
      var confirmation = window.prompt('실제 발행을 확인하려면 PUBLISH를 입력하세요.');
      if (confirmation !== 'PUBLISH') return;
      payload.confirm = confirmation;
    }
  } else if (!dryRun && action !== 'status'
      && !window.confirm((episode.id || episode.episode_id) + ' · ' + action + ' 실행을 시작할까요?')) {
    return;
  }
  try {
    showMessage('실행 중: ' + action + ' …');
    var response = await api(
      '/api/channels/' + encodeURIComponent(CURRENT) + '/actions/' + encodeURIComponent(action),
      {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      }
    );
    var output = response.stdout || response.stderr
      || JSON.stringify(response.command || response.result || response, null, 2);
    showMessage((response.dry_run ? '검증 완료' : '실행 완료') + ' · ' + action
      + '\n' + output.slice(0, 4000), response.ok === false);
    await reloadEpisodes();
  } catch (error) {
    showMessage(error.message, true);
  }
}

function assetTabDefinition(tabId) {
  return ASSET_TABS.find(function (tab) { return tab.id === tabId; }) || ASSET_TABS[0];
}

function assetFilesForTab(data, tabId) {
  var definition = assetTabDefinition(tabId);
  var groups = data && data.groups || {};
  var files = [];
  definition.groups.forEach(function (groupName) {
    (groups[groupName] || []).forEach(function (file) {
      files.push(Object.assign({ asset_group: groupName }, file));
    });
  });
  return files;
}

function assetFileUrl(file, state) {
  state = state || ASSET_STATE;
  var context = state && state.context || {};
  var query = new URLSearchParams();
  query.set('episode_id', context.episodeId || '');
  query.set('source_profile', context.sourceProfile || '');
  query.set('path', file.rel);
  if (context.platform) query.set('platform', context.platform);
  return '/api/channels/' + encodeURIComponent(context.channelId || '') + '/asset/file?' + query.toString();
}

function formatAssetBytes(bytes) {
  var value = Number(bytes || 0);
  if (value < 1024) return value + ' B';
  if (value < 1024 * 1024) return (value / 1024).toFixed(value < 10240 ? 1 : 0) + ' KB';
  return (value / (1024 * 1024)).toFixed(value < 10 * 1024 * 1024 ? 1 : 0) + ' MB';
}

function textAsset(file) {
  return /^text\//.test(file.type || '') || file.type === 'application/json; charset=utf-8'
    || /\.(?:md|json|txt|srt|vtt)$/i.test(file.name || file.rel || '');
}

function cleanupAssetMedia() {
  var panel = document.getElementById('assetPanel');
  panel.querySelectorAll('img').forEach(function (preview) {
    preview.removeAttribute('src');
  });
  panel.querySelectorAll('video,audio').forEach(function (media) {
    try {
      media.pause();
      media.removeAttribute('src');
      media.load();
    } catch (_error) {
      // The element may already have been detached while a tab was changing.
    }
  });
}

function assetFileListHtml(files, selectedRel) {
  return '<div class="asset-file-list" role="group" aria-label="자산 파일">'
    + files.map(function (file) {
      return '<button class="asset-file' + (file.rel === selectedRel ? ' active' : '')
        + '" type="button" aria-pressed="' + (file.rel === selectedRel ? 'true' : 'false')
        + '" data-asset-path="' + esc(file.rel) + '">'
        + '<span class="asset-file-name">' + esc(file.name) + '</span>'
        + '<span class="asset-file-meta">' + esc(file.asset_group) + ' · '
        + formatAssetBytes(file.size) + '<br>' + esc(file.rel) + '</span>'
        + '</button>';
    }).join('')
    + '</div>';
}

function assetViewerHeadHtml(file) {
  return '<div class="asset-viewer-head"><strong>' + esc(file.name) + '</strong>'
    + '<span class="spacer"></span><span class="muted">' + formatAssetBytes(file.size) + '</span>'
    + '<a href="' + esc(assetFileUrl(file)) + '" target="_blank" rel="noopener">원본 열기 ↗</a></div>';
}

function selectedAsset(files) {
  var requested = ASSET_STATE.selected[ASSET_STATE.tab];
  var file = files.find(function (item) { return item.rel === requested; }) || files[0];
  if (file) ASSET_STATE.selected[ASSET_STATE.tab] = file.rel;
  return file;
}

async function loadAssetText(file) {
  var preview = document.getElementById('assetTextPreview');
  if (!preview || !ASSET_STATE) return;
  if (file.size > ASSET_TEXT_LIMIT) {
    preview.textContent = '파일이 ' + formatAssetBytes(file.size)
      + '로 미리보기 제한(' + formatAssetBytes(ASSET_TEXT_LIMIT) + ')을 초과했습니다.\n'
      + '오른쪽 위의 원본 열기를 사용하세요.';
    return;
  }
  var sequence = ++ASSET_TEXT_SEQUENCE;
  var expectedPath = file.rel;
  preview.textContent = '내용을 불러오는 중…';
  try {
    var response = await fetch(assetFileUrl(file), { headers: headers() });
    if (!response.ok) throw new Error('HTTP ' + response.status);
    var text = await response.text();
    if (sequence !== ASSET_TEXT_SEQUENCE || !ASSET_STATE
        || ASSET_STATE.selected[ASSET_STATE.tab] !== expectedPath) return;
    preview.textContent = text.length > ASSET_TEXT_LIMIT
      ? text.slice(0, ASSET_TEXT_LIMIT) + '\n\n… 미리보기 길이 제한으로 나머지를 생략했습니다.'
      : text;
  } catch (error) {
    if (sequence !== ASSET_TEXT_SEQUENCE) return;
    preview.textContent = '미리보기를 불러오지 못했습니다: ' + error.message;
  }
}

function renderAssetPanel() {
  if (!ASSET_STATE || !ASSET_STATE.data) return;
  var renderSequence = ++ASSET_RENDER_SEQUENCE;
  cleanupAssetMedia();
  var panel = document.getElementById('assetPanel');
  var files = assetFilesForTab(ASSET_STATE.data, ASSET_STATE.tab);
  if (!files.length) {
    panel.innerHTML = '<div class="asset-state" role="status"><div><strong>자산이 없습니다.</strong>'
      + '이 유형의 산출물이 아직 생성되지 않았습니다.</div></div>';
    return;
  }
  var file = selectedAsset(files);
  var list = assetFileListHtml(files, file.rel);
  var viewer;
  if (textAsset(file)) {
    viewer = '<div class="asset-viewer">' + assetViewerHeadHtml(file)
      + '<div class="asset-preview"><pre id="assetTextPreview" class="asset-text"></pre></div></div>';
  } else if (/^image\//.test(file.type || '')) {
    viewer = '<div class="asset-viewer">' + assetViewerHeadHtml(file)
      + '<div class="asset-preview asset-visual"><img id="assetImagePreview" loading="eager" src="'
      + esc(assetFileUrl(file)) + '" alt="' + esc(file.name) + '"><span id="assetVisualError"'
      + ' class="asset-preview-error hidden">이미지를 표시할 수 없습니다.</span></div></div>';
  } else if (/^video\//.test(file.type || '')) {
    viewer = '<div class="asset-viewer">' + assetViewerHeadHtml(file)
      + '<div class="asset-preview asset-visual"><video id="assetMediaPreview" controls playsinline'
      + ' preload="metadata" src="' + esc(assetFileUrl(file)) + '" aria-label="' + esc(file.name)
      + ' 영상 미리보기"></video><span id="assetVisualError" class="asset-preview-error hidden">'
      + '이 브라우저에서 영상을 재생할 수 없습니다.</span></div></div>';
  } else if (/^audio\//.test(file.type || '')) {
    viewer = '<div class="asset-viewer">' + assetViewerHeadHtml(file)
      + '<div class="asset-preview asset-audio"><strong>' + esc(file.name) + '</strong>'
      + '<audio id="assetMediaPreview" controls preload="metadata" src="' + esc(assetFileUrl(file))
      + '" aria-label="' + esc(file.name) + ' 오디오 미리보기"></audio>'
      + '<span id="assetVisualError" class="asset-preview-error hidden">'
      + '이 브라우저에서 오디오를 재생할 수 없습니다.</span></div></div>';
  } else {
    viewer = '<div class="asset-viewer">' + assetViewerHeadHtml(file)
      + '<div class="asset-state"><div><strong>브라우저 미리보기를 지원하지 않는 파일입니다.</strong>'
      + '원본 열기를 사용하세요.</div></div></div>';
  }
  panel.innerHTML = '<div class="asset-layout">' + list + viewer + '</div>';
  panel.removeAttribute('aria-label');
  panel.setAttribute('aria-labelledby', 'asset-tab-' + ASSET_STATE.tab);

  if (textAsset(file)) loadAssetText(file);
  var visual = document.getElementById('assetImagePreview') || document.getElementById('assetMediaPreview');
  if (visual) {
    visual.addEventListener('error', function () {
      if (renderSequence !== ASSET_RENDER_SEQUENCE || !visual.isConnected) return;
      visual.classList.add('hidden');
      var error = visual.parentElement.querySelector('.asset-preview-error');
      if (error) error.classList.remove('hidden');
    }, { once: true });
  }
}

function renderAssetTabs() {
  if (!ASSET_STATE || !ASSET_STATE.data) return;
  var available = ASSET_TABS.map(function (tab) {
    return { tab: tab, count: assetFilesForTab(ASSET_STATE.data, tab.id).length };
  });
  if (!ASSET_STATE.tab || !available.some(function (item) {
    return item.tab.id === ASSET_STATE.tab && item.count > 0;
  })) {
    var first = available.find(function (item) { return item.count > 0; });
    ASSET_STATE.tab = first ? first.tab.id : ASSET_TABS[0].id;
  }
  document.getElementById('assetTabs').innerHTML = available.map(function (item) {
    var selected = item.tab.id === ASSET_STATE.tab;
    return '<button id="asset-tab-' + esc(item.tab.id) + '" class="asset-tab" type="button" role="tab"'
      + ' aria-selected="' + (selected ? 'true' : 'false') + '" aria-controls="assetPanel"'
      + ' tabindex="' + (selected ? '0' : '-1') + '" data-asset-tab="' + esc(item.tab.id) + '"'
      + (item.count ? '' : ' disabled') + '>' + esc(item.tab.label) + ' ' + item.count + '</button>';
  }).join('');
  renderAssetPanel();
}

function renderAssetLoadError(error) {
  document.getElementById('assetTabs').innerHTML = '';
  var panel = document.getElementById('assetPanel');
  panel.removeAttribute('aria-labelledby');
  panel.setAttribute('aria-label', '자산 내용');
  panel.innerHTML =
    '<div class="asset-state" role="alert"><div><strong>자산을 불러오지 못했습니다.</strong>'
    + esc(error.message) + '<br><br><button class="btn" type="button" data-asset-retry>다시 시도</button>'
    + '</div></div>';
}

async function loadAssetDialogData(state) {
  var sequence = ++ASSET_REQUEST_SEQUENCE;
  document.getElementById('assetTabs').innerHTML = '';
  var panel = document.getElementById('assetPanel');
  panel.removeAttribute('aria-labelledby');
  panel.setAttribute('aria-label', '자산 내용');
  panel.innerHTML = '<div class="asset-state" role="status">자산을 불러오는 중…</div>';
  var query = new URLSearchParams();
  query.set('episode_id', state.context.episodeId);
  query.set('source_profile', state.context.sourceProfile || '');
  if (state.context.platform) query.set('platform', state.context.platform);
  try {
    var response = await api('/api/channels/' + encodeURIComponent(state.context.channelId)
      + '/assets?' + query.toString());
    if (sequence !== ASSET_REQUEST_SEQUENCE || ASSET_STATE !== state) return;
    state.data = response;
    renderAssetTabs();
  } catch (error) {
    if (sequence !== ASSET_REQUEST_SEQUENCE || ASSET_STATE !== state) return;
    renderAssetLoadError(error);
  }
}

function inspectAssets(groupIndex, item) {
  var group = EPISODE_GROUPS[groupIndex];
  if (!group || group.duplicateProfiles.length) return;
  var episode = selectedVariant(group);
  if (episode.observed === false || episode.assets_available === false) {
    showMessage('아직 연결해 볼 실제 자산이 없는 계획 에피소드입니다.', true);
    return;
  }
  var platformSelect = item && item.querySelector('[data-role="platform"]');
  var platform = platformSelect ? platformSelect.value : selectedEpisodePlatform(group, episode);
  ASSET_RETURN_FOCUS = document.activeElement;
  ASSET_STATE = {
    groupIndex: groupIndex,
    context: {
      channelId: CURRENT,
      episodeId: episode.id || episode.episode_id,
      sourceProfile: episode.source_profile || '',
      platform: platform,
      title: episode.title || episode.topic || ''
    },
    data: null,
    tab: null,
    selected: Object.create(null)
  };
  document.getElementById('assetDialogTitle').textContent =
    (episode.id || episode.episode_id) + ' 자산';
  document.getElementById('assetDialogMeta').textContent =
    (episode.title || episode.topic || '(제목 없음)') + ' · ' + (episode.source_profile || '')
    + (platform ? ' · ' + platform : '');
  var dialog = document.getElementById('assetDialog');
  if (!dialog.open) dialog.showModal();
  loadAssetDialogData(ASSET_STATE);
}

function closeAssetDialogState() {
  ASSET_REQUEST_SEQUENCE += 1;
  ASSET_TEXT_SEQUENCE += 1;
  ASSET_RENDER_SEQUENCE += 1;
  cleanupAssetMedia();
  ASSET_STATE = null;
  var focus = ASSET_RETURN_FOCUS;
  ASSET_RETURN_FOCUS = null;
  if (focus && document.contains(focus)) {
    requestAnimationFrame(function () { focus.focus(); });
  }
}

function openDocument() {
  if (CURRENT) window.open('/channels/' + encodeURIComponent(CURRENT), '_blank');
}

async function renderDocument() {
  if (!CURRENT) return;
  try {
    var response = await api('/api/channels/' + encodeURIComponent(CURRENT) + '/documents/render', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: '{}'
    });
    showMessage('HTML 생성 완료: ' + (response.output_path || ''));
  } catch (error) {
    showMessage(error.message, true);
  }
}

function showMessage(text, bad) {
  var element = document.getElementById('msg');
  element.textContent = text || '';
  element.className = 'notice' + (text ? ' on' : '') + (bad ? ' bad' : '');
}

function showDialogMessage(id, text, bad) {
  var element = document.getElementById(id);
  element.textContent = text || '';
  element.className = 'notice dialog-message' + (text ? ' on' : '') + (bad ? ' bad' : '');
}

function openNewChannel() {

function restoreEpisodeControlFocus(surfaceId, groupIndex, role) {
  requestAnimationFrame(function () {
    var surface = document.getElementById(surfaceId);
    var replacement = surface && surface.querySelector(
      '[data-episode-item][data-group-index="' + groupIndex + '"] [data-role="' + role + '"]'
    );
